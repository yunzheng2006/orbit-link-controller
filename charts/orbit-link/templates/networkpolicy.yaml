{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orbit-link.fullname" . }}
  labels:
    {{- include "orbit-link.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "orbit-link.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: UDP, port: 7844 }
        - { protocol: TCP, port: 7844 }
    {{- if .Values.networkPolicy.localPort }}
    - ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.localPort }} }
    {{- end }}
{{- end }}

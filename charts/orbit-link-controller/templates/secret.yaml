{{- if not .Values.orbit.existingSecret }}
{{- if not .Values.orbit.apiToken }}
{{- fail "Set orbit.existingSecret (a Secret holding an Orbit API token with the Orbit Link scope) or orbit.apiToken." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "olc.secret" . }}
  labels: {{- include "olc.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.orbit.apiToken | quote }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbit-link.fullname" . }}
  labels:
    {{- include "orbit-link.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "orbit-link.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit-link.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        {{- if not .Values.tunnel.existingSecret }}
        checksum/secret: {{ .Values.tunnel.token | sha256sum | trunc 16 }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ include "orbit-link.grace" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: connector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.tunnel.tcp .Values.extraArgs }}
          args:
            {{- if .Values.tunnel.tcp }}
            - -tcp
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          env:
            - name: ORBIT_LINK_ENDPOINT
              value: {{ .Values.tunnel.endpoint | quote }}
            - name: ORBIT_LINK_FINGERPRINT
              value: {{ .Values.tunnel.fingerprint | quote }}
            - name: ORBIT_LINK_LOCAL
              value: {{ .Values.tunnel.local | quote }}
            - name: ORBIT_LINK_TOKEN_FILE
              value: /var/run/orbit-link/token
            - name: ORBIT_LINK_DRAIN
              value: {{ .Values.drain | quote }}
            - name: ORBIT_LINK_HEALTH
              value: 127.0.0.1:9901
            - name: ORBIT_LINK_NO_UPDATE
              value: "1"
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          volumeMounts:
            - name: token
              mountPath: /var/run/orbit-link
              readOnly: true
          startupProbe:
            exec: { command: ["/orbit-link", "-healthcheck"] }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: 5
          readinessProbe:
            exec: { command: ["/orbit-link", "-healthcheck"] }
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: 5
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            exec: { command: ["/orbit-link", "-healthcheck"] }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: 5
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: token
          secret:
            secretName: {{ include "orbit-link.secretName" . }}
            defaultMode: 0400
            items:
              - key: {{ .Values.tunnel.existingSecretKey }}
                path: token
      {{- if and .Values.topologySpread.enabled (gt (int .Values.replicaCount) 1) }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "orbit-link.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "orbit-link.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}

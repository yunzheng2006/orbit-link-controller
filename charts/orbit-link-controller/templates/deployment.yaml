apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olc.name" . }}
  labels: {{- include "olc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {{- include "olc.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "olc.selector" . | nindent 8 }}
      annotations:
        {{- if not .Values.orbit.existingSecret }}
        checksum/secret: {{ .Values.orbit.apiToken | sha256sum | trunc 16 }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "olc.name" . }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: {{ include "olc.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: {{- include "olc.args" . | nindent 12 }}
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports:
            - { name: router, containerPort: 8080, protocol: TCP }
            - { name: metrics, containerPort: 8081, protocol: TCP }
            - { name: health, containerPort: 8082, protocol: TCP }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          volumeMounts:
            - name: orbit-api
              mountPath: /var/run/orbit
              readOnly: true
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: orbit-api
          secret:
            secretName: {{ include "olc.secret" . }}
            defaultMode: 0400
            items:
              - key: {{ .Values.orbit.existingSecretKey }}
                path: api-token
      {{- if gt (int .Values.replicaCount) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "olc.selector" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}

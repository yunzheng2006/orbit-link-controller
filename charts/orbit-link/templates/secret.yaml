{{- if not .Values.tunnel.existingSecret }}
{{- if not .Values.tunnel.token }}
{{- fail "Set tunnel.existingSecret (a Secret holding the tunnel credential) or tunnel.token." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orbit-link.fullname" . }}
  labels:
    {{- include "orbit-link.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.tunnel.token | quote }}
{{- end }}
